syntax = "proto3";

package nexora.inventory;

message InvItemCategoryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvItemCategoryService {
  rpc GetInvItemCategory (GetInvItemCategoryRequest) returns (InvItemCategoryMessage);
  rpc ListInvItemCategorys (ListInvItemCategoryRequest) returns (stream InvItemCategoryMessage);
}

message GetInvItemCategoryRequest { string id = 1; }
message ListInvItemCategoryRequest { string tenant_id = 1; int32 limit = 2; }
