syntax = "proto3";

package nexora.inventory;

message InvTransferOrderMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvTransferOrderService {
  rpc GetInvTransferOrder (GetInvTransferOrderRequest) returns (InvTransferOrderMessage);
  rpc ListInvTransferOrders (ListInvTransferOrderRequest) returns (stream InvTransferOrderMessage);
}

message GetInvTransferOrderRequest { string id = 1; }
message ListInvTransferOrderRequest { string tenant_id = 1; int32 limit = 2; }
