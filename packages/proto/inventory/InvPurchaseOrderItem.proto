syntax = "proto3";

package nexora.inventory;

message InvPurchaseOrderItemMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvPurchaseOrderItemService {
  rpc GetInvPurchaseOrderItem (GetInvPurchaseOrderItemRequest) returns (InvPurchaseOrderItemMessage);
  rpc ListInvPurchaseOrderItems (ListInvPurchaseOrderItemRequest) returns (stream InvPurchaseOrderItemMessage);
}

message GetInvPurchaseOrderItemRequest { string id = 1; }
message ListInvPurchaseOrderItemRequest { string tenant_id = 1; int32 limit = 2; }
