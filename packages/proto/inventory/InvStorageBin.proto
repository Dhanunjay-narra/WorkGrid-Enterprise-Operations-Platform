syntax = "proto3";

package nexora.inventory;

message InvStorageBinMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvStorageBinService {
  rpc GetInvStorageBin (GetInvStorageBinRequest) returns (InvStorageBinMessage);
  rpc ListInvStorageBins (ListInvStorageBinRequest) returns (stream InvStorageBinMessage);
}

message GetInvStorageBinRequest { string id = 1; }
message ListInvStorageBinRequest { string tenant_id = 1; int32 limit = 2; }
