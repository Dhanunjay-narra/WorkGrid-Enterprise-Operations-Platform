syntax = "proto3";

package nexora.inventory;

message InvGoodsReceiptMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvGoodsReceiptService {
  rpc GetInvGoodsReceipt (GetInvGoodsReceiptRequest) returns (InvGoodsReceiptMessage);
  rpc ListInvGoodsReceipts (ListInvGoodsReceiptRequest) returns (stream InvGoodsReceiptMessage);
}

message GetInvGoodsReceiptRequest { string id = 1; }
message ListInvGoodsReceiptRequest { string tenant_id = 1; int32 limit = 2; }
