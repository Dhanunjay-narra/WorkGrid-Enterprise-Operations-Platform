syntax = "proto3";

package nexora.inventory;

message InvReorderRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvReorderRuleService {
  rpc GetInvReorderRule (GetInvReorderRuleRequest) returns (InvReorderRuleMessage);
  rpc ListInvReorderRules (ListInvReorderRuleRequest) returns (stream InvReorderRuleMessage);
}

message GetInvReorderRuleRequest { string id = 1; }
message ListInvReorderRuleRequest { string tenant_id = 1; int32 limit = 2; }
