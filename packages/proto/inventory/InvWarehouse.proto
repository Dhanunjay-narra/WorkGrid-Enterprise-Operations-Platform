syntax = "proto3";

package nexora.inventory;

message InvWarehouseMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvWarehouseService {
  rpc GetInvWarehouse (GetInvWarehouseRequest) returns (InvWarehouseMessage);
  rpc ListInvWarehouses (ListInvWarehouseRequest) returns (stream InvWarehouseMessage);
}

message GetInvWarehouseRequest { string id = 1; }
message ListInvWarehouseRequest { string tenant_id = 1; int32 limit = 2; }
