syntax = "proto3";

package nexora.inventory;

message InvStockMovementMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvStockMovementService {
  rpc GetInvStockMovement (GetInvStockMovementRequest) returns (InvStockMovementMessage);
  rpc ListInvStockMovements (ListInvStockMovementRequest) returns (stream InvStockMovementMessage);
}

message GetInvStockMovementRequest { string id = 1; }
message ListInvStockMovementRequest { string tenant_id = 1; int32 limit = 2; }
