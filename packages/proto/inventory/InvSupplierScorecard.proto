syntax = "proto3";

package nexora.inventory;

message InvSupplierScorecardMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvSupplierScorecardService {
  rpc GetInvSupplierScorecard (GetInvSupplierScorecardRequest) returns (InvSupplierScorecardMessage);
  rpc ListInvSupplierScorecards (ListInvSupplierScorecardRequest) returns (stream InvSupplierScorecardMessage);
}

message GetInvSupplierScorecardRequest { string id = 1; }
message ListInvSupplierScorecardRequest { string tenant_id = 1; int32 limit = 2; }
