syntax = "proto3";

package nexora.inventory;

message InvStockLevelMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvStockLevelService {
  rpc GetInvStockLevel (GetInvStockLevelRequest) returns (InvStockLevelMessage);
  rpc ListInvStockLevels (ListInvStockLevelRequest) returns (stream InvStockLevelMessage);
}

message GetInvStockLevelRequest { string id = 1; }
message ListInvStockLevelRequest { string tenant_id = 1; int32 limit = 2; }
