syntax = "proto3";

package nexora.inventory;

message InvPurchaseOrderMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvPurchaseOrderService {
  rpc GetInvPurchaseOrder (GetInvPurchaseOrderRequest) returns (InvPurchaseOrderMessage);
  rpc ListInvPurchaseOrders (ListInvPurchaseOrderRequest) returns (stream InvPurchaseOrderMessage);
}

message GetInvPurchaseOrderRequest { string id = 1; }
message ListInvPurchaseOrderRequest { string tenant_id = 1; int32 limit = 2; }
