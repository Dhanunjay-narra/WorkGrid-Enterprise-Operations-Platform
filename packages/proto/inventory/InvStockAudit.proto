syntax = "proto3";

package nexora.inventory;

message InvStockAuditMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service InvStockAuditService {
  rpc GetInvStockAudit (GetInvStockAuditRequest) returns (InvStockAuditMessage);
  rpc ListInvStockAudits (ListInvStockAuditRequest) returns (stream InvStockAuditMessage);
}

message GetInvStockAuditRequest { string id = 1; }
message ListInvStockAuditRequest { string tenant_id = 1; int32 limit = 2; }
