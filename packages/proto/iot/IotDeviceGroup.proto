syntax = "proto3";

package nexora.iot;

message IotDeviceGroupMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotDeviceGroupService {
  rpc GetIotDeviceGroup (GetIotDeviceGroupRequest) returns (IotDeviceGroupMessage);
  rpc ListIotDeviceGroups (ListIotDeviceGroupRequest) returns (stream IotDeviceGroupMessage);
}

message GetIotDeviceGroupRequest { string id = 1; }
message ListIotDeviceGroupRequest { string tenant_id = 1; int32 limit = 2; }
