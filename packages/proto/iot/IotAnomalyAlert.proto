syntax = "proto3";

package nexora.iot;

message IotAnomalyAlertMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotAnomalyAlertService {
  rpc GetIotAnomalyAlert (GetIotAnomalyAlertRequest) returns (IotAnomalyAlertMessage);
  rpc ListIotAnomalyAlerts (ListIotAnomalyAlertRequest) returns (stream IotAnomalyAlertMessage);
}

message GetIotAnomalyAlertRequest { string id = 1; }
message ListIotAnomalyAlertRequest { string tenant_id = 1; int32 limit = 2; }
