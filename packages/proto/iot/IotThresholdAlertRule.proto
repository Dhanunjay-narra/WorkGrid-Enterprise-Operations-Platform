syntax = "proto3";

package nexora.iot;

message IotThresholdAlertRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotThresholdAlertRuleService {
  rpc GetIotThresholdAlertRule (GetIotThresholdAlertRuleRequest) returns (IotThresholdAlertRuleMessage);
  rpc ListIotThresholdAlertRules (ListIotThresholdAlertRuleRequest) returns (stream IotThresholdAlertRuleMessage);
}

message GetIotThresholdAlertRuleRequest { string id = 1; }
message ListIotThresholdAlertRuleRequest { string tenant_id = 1; int32 limit = 2; }
