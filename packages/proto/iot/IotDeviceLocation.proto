syntax = "proto3";

package nexora.iot;

message IotDeviceLocationMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotDeviceLocationService {
  rpc GetIotDeviceLocation (GetIotDeviceLocationRequest) returns (IotDeviceLocationMessage);
  rpc ListIotDeviceLocations (ListIotDeviceLocationRequest) returns (stream IotDeviceLocationMessage);
}

message GetIotDeviceLocationRequest { string id = 1; }
message ListIotDeviceLocationRequest { string tenant_id = 1; int32 limit = 2; }
