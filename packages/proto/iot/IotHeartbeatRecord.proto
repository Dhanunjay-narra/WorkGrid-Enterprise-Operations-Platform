syntax = "proto3";

package nexora.iot;

message IotHeartbeatRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotHeartbeatRecordService {
  rpc GetIotHeartbeatRecord (GetIotHeartbeatRecordRequest) returns (IotHeartbeatRecordMessage);
  rpc ListIotHeartbeatRecords (ListIotHeartbeatRecordRequest) returns (stream IotHeartbeatRecordMessage);
}

message GetIotHeartbeatRecordRequest { string id = 1; }
message ListIotHeartbeatRecordRequest { string tenant_id = 1; int32 limit = 2; }
