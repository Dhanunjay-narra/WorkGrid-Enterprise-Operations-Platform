syntax = "proto3";

package nexora.iot;

message IotDeviceCommandMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotDeviceCommandService {
  rpc GetIotDeviceCommand (GetIotDeviceCommandRequest) returns (IotDeviceCommandMessage);
  rpc ListIotDeviceCommands (ListIotDeviceCommandRequest) returns (stream IotDeviceCommandMessage);
}

message GetIotDeviceCommandRequest { string id = 1; }
message ListIotDeviceCommandRequest { string tenant_id = 1; int32 limit = 2; }
