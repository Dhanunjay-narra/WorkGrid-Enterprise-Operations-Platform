syntax = "proto3";

package nexora.iot;

message IotTelemetryMetricMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotTelemetryMetricService {
  rpc GetIotTelemetryMetric (GetIotTelemetryMetricRequest) returns (IotTelemetryMetricMessage);
  rpc ListIotTelemetryMetrics (ListIotTelemetryMetricRequest) returns (stream IotTelemetryMetricMessage);
}

message GetIotTelemetryMetricRequest { string id = 1; }
message ListIotTelemetryMetricRequest { string tenant_id = 1; int32 limit = 2; }
