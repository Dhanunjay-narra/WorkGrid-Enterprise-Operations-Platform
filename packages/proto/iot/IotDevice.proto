syntax = "proto3";

package nexora.iot;

message IotDeviceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IotDeviceService {
  rpc GetIotDevice (GetIotDeviceRequest) returns (IotDeviceMessage);
  rpc ListIotDevices (ListIotDeviceRequest) returns (stream IotDeviceMessage);
}

message GetIotDeviceRequest { string id = 1; }
message ListIotDeviceRequest { string tenant_id = 1; int32 limit = 2; }
