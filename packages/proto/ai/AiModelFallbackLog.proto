syntax = "proto3";

package nexora.ai;

message AiModelFallbackLogMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiModelFallbackLogService {
  rpc GetAiModelFallbackLog (GetAiModelFallbackLogRequest) returns (AiModelFallbackLogMessage);
  rpc ListAiModelFallbackLogs (ListAiModelFallbackLogRequest) returns (stream AiModelFallbackLogMessage);
}

message GetAiModelFallbackLogRequest { string id = 1; }
message ListAiModelFallbackLogRequest { string tenant_id = 1; int32 limit = 2; }
