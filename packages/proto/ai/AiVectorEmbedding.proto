syntax = "proto3";

package nexora.ai;

message AiVectorEmbeddingMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiVectorEmbeddingService {
  rpc GetAiVectorEmbedding (GetAiVectorEmbeddingRequest) returns (AiVectorEmbeddingMessage);
  rpc ListAiVectorEmbeddings (ListAiVectorEmbeddingRequest) returns (stream AiVectorEmbeddingMessage);
}

message GetAiVectorEmbeddingRequest { string id = 1; }
message ListAiVectorEmbeddingRequest { string tenant_id = 1; int32 limit = 2; }
