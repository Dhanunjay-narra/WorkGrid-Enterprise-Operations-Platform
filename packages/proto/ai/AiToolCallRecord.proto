syntax = "proto3";

package nexora.ai;

message AiToolCallRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiToolCallRecordService {
  rpc GetAiToolCallRecord (GetAiToolCallRecordRequest) returns (AiToolCallRecordMessage);
  rpc ListAiToolCallRecords (ListAiToolCallRecordRequest) returns (stream AiToolCallRecordMessage);
}

message GetAiToolCallRecordRequest { string id = 1; }
message ListAiToolCallRecordRequest { string tenant_id = 1; int32 limit = 2; }
