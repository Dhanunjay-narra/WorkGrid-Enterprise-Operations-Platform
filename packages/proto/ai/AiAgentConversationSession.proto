syntax = "proto3";

package nexora.ai;

message AiAgentConversationSessionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiAgentConversationSessionService {
  rpc GetAiAgentConversationSession (GetAiAgentConversationSessionRequest) returns (AiAgentConversationSessionMessage);
  rpc ListAiAgentConversationSessions (ListAiAgentConversationSessionRequest) returns (stream AiAgentConversationSessionMessage);
}

message GetAiAgentConversationSessionRequest { string id = 1; }
message ListAiAgentConversationSessionRequest { string tenant_id = 1; int32 limit = 2; }
