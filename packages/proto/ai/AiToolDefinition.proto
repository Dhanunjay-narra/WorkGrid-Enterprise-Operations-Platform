syntax = "proto3";

package nexora.ai;

message AiToolDefinitionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiToolDefinitionService {
  rpc GetAiToolDefinition (GetAiToolDefinitionRequest) returns (AiToolDefinitionMessage);
  rpc ListAiToolDefinitions (ListAiToolDefinitionRequest) returns (stream AiToolDefinitionMessage);
}

message GetAiToolDefinitionRequest { string id = 1; }
message ListAiToolDefinitionRequest { string tenant_id = 1; int32 limit = 2; }
