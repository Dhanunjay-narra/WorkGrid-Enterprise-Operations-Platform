syntax = "proto3";

package nexora.ai;

message AiAgentExecutionLogMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiAgentExecutionLogService {
  rpc GetAiAgentExecutionLog (GetAiAgentExecutionLogRequest) returns (AiAgentExecutionLogMessage);
  rpc ListAiAgentExecutionLogs (ListAiAgentExecutionLogRequest) returns (stream AiAgentExecutionLogMessage);
}

message GetAiAgentExecutionLogRequest { string id = 1; }
message ListAiAgentExecutionLogRequest { string tenant_id = 1; int32 limit = 2; }
