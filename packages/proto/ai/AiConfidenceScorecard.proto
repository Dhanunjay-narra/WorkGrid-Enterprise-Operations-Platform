syntax = "proto3";

package nexora.ai;

message AiConfidenceScorecardMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiConfidenceScorecardService {
  rpc GetAiConfidenceScorecard (GetAiConfidenceScorecardRequest) returns (AiConfidenceScorecardMessage);
  rpc ListAiConfidenceScorecards (ListAiConfidenceScorecardRequest) returns (stream AiConfidenceScorecardMessage);
}

message GetAiConfidenceScorecardRequest { string id = 1; }
message ListAiConfidenceScorecardRequest { string tenant_id = 1; int32 limit = 2; }
