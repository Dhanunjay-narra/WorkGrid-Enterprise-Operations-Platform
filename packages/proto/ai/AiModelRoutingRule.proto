syntax = "proto3";

package nexora.ai;

message AiModelRoutingRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service AiModelRoutingRuleService {
  rpc GetAiModelRoutingRule (GetAiModelRoutingRuleRequest) returns (AiModelRoutingRuleMessage);
  rpc ListAiModelRoutingRules (ListAiModelRoutingRuleRequest) returns (stream AiModelRoutingRuleMessage);
}

message GetAiModelRoutingRuleRequest { string id = 1; }
message ListAiModelRoutingRuleRequest { string tenant_id = 1; int32 limit = 2; }
