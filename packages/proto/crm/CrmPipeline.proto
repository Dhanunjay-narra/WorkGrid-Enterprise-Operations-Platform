syntax = "proto3";

package nexora.crm;

message CrmPipelineMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmPipelineService {
  rpc GetCrmPipeline (GetCrmPipelineRequest) returns (CrmPipelineMessage);
  rpc ListCrmPipelines (ListCrmPipelineRequest) returns (stream CrmPipelineMessage);
}

message GetCrmPipelineRequest { string id = 1; }
message ListCrmPipelineRequest { string tenant_id = 1; int32 limit = 2; }
