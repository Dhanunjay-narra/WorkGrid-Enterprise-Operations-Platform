syntax = "proto3";

package nexora.crm;

message CrmEmailSequenceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmEmailSequenceService {
  rpc GetCrmEmailSequence (GetCrmEmailSequenceRequest) returns (CrmEmailSequenceMessage);
  rpc ListCrmEmailSequences (ListCrmEmailSequenceRequest) returns (stream CrmEmailSequenceMessage);
}

message GetCrmEmailSequenceRequest { string id = 1; }
message ListCrmEmailSequenceRequest { string tenant_id = 1; int32 limit = 2; }
