syntax = "proto3";

package nexora.crm;

message CrmLeadMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmLeadService {
  rpc GetCrmLead (GetCrmLeadRequest) returns (CrmLeadMessage);
  rpc ListCrmLeads (ListCrmLeadRequest) returns (stream CrmLeadMessage);
}

message GetCrmLeadRequest { string id = 1; }
message ListCrmLeadRequest { string tenant_id = 1; int32 limit = 2; }
