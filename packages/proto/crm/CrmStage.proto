syntax = "proto3";

package nexora.crm;

message CrmStageMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmStageService {
  rpc GetCrmStage (GetCrmStageRequest) returns (CrmStageMessage);
  rpc ListCrmStages (ListCrmStageRequest) returns (stream CrmStageMessage);
}

message GetCrmStageRequest { string id = 1; }
message ListCrmStageRequest { string tenant_id = 1; int32 limit = 2; }
