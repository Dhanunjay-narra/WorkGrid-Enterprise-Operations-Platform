syntax = "proto3";

package nexora.crm;

message CrmMeetingMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmMeetingService {
  rpc GetCrmMeeting (GetCrmMeetingRequest) returns (CrmMeetingMessage);
  rpc ListCrmMeetings (ListCrmMeetingRequest) returns (stream CrmMeetingMessage);
}

message GetCrmMeetingRequest { string id = 1; }
message ListCrmMeetingRequest { string tenant_id = 1; int32 limit = 2; }
