syntax = "proto3";

package nexora.crm;

message CrmTerritoryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmTerritoryService {
  rpc GetCrmTerritory (GetCrmTerritoryRequest) returns (CrmTerritoryMessage);
  rpc ListCrmTerritorys (ListCrmTerritoryRequest) returns (stream CrmTerritoryMessage);
}

message GetCrmTerritoryRequest { string id = 1; }
message ListCrmTerritoryRequest { string tenant_id = 1; int32 limit = 2; }
