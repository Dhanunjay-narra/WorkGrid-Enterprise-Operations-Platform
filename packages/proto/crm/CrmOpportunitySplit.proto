syntax = "proto3";

package nexora.crm;

message CrmOpportunitySplitMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmOpportunitySplitService {
  rpc GetCrmOpportunitySplit (GetCrmOpportunitySplitRequest) returns (CrmOpportunitySplitMessage);
  rpc ListCrmOpportunitySplits (ListCrmOpportunitySplitRequest) returns (stream CrmOpportunitySplitMessage);
}

message GetCrmOpportunitySplitRequest { string id = 1; }
message ListCrmOpportunitySplitRequest { string tenant_id = 1; int32 limit = 2; }
