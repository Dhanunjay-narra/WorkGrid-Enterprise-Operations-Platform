syntax = "proto3";

package nexora.crm;

message CrmLeadScoreMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmLeadScoreService {
  rpc GetCrmLeadScore (GetCrmLeadScoreRequest) returns (CrmLeadScoreMessage);
  rpc ListCrmLeadScores (ListCrmLeadScoreRequest) returns (stream CrmLeadScoreMessage);
}

message GetCrmLeadScoreRequest { string id = 1; }
message ListCrmLeadScoreRequest { string tenant_id = 1; int32 limit = 2; }
