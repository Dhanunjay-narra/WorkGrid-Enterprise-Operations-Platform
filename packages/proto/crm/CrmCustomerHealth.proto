syntax = "proto3";

package nexora.crm;

message CrmCustomerHealthMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmCustomerHealthService {
  rpc GetCrmCustomerHealth (GetCrmCustomerHealthRequest) returns (CrmCustomerHealthMessage);
  rpc ListCrmCustomerHealths (ListCrmCustomerHealthRequest) returns (stream CrmCustomerHealthMessage);
}

message GetCrmCustomerHealthRequest { string id = 1; }
message ListCrmCustomerHealthRequest { string tenant_id = 1; int32 limit = 2; }
