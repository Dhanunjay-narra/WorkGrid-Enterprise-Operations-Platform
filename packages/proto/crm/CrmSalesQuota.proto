syntax = "proto3";

package nexora.crm;

message CrmSalesQuotaMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmSalesQuotaService {
  rpc GetCrmSalesQuota (GetCrmSalesQuotaRequest) returns (CrmSalesQuotaMessage);
  rpc ListCrmSalesQuotas (ListCrmSalesQuotaRequest) returns (stream CrmSalesQuotaMessage);
}

message GetCrmSalesQuotaRequest { string id = 1; }
message ListCrmSalesQuotaRequest { string tenant_id = 1; int32 limit = 2; }
