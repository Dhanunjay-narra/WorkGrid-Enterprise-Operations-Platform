syntax = "proto3";

package nexora.crm;

message CrmDealMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CrmDealService {
  rpc GetCrmDeal (GetCrmDealRequest) returns (CrmDealMessage);
  rpc ListCrmDeals (ListCrmDealRequest) returns (stream CrmDealMessage);
}

message GetCrmDealRequest { string id = 1; }
message ListCrmDealRequest { string tenant_id = 1; int32 limit = 2; }
