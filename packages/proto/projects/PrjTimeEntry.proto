syntax = "proto3";

package nexora.projects;

message PrjTimeEntryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjTimeEntryService {
  rpc GetPrjTimeEntry (GetPrjTimeEntryRequest) returns (PrjTimeEntryMessage);
  rpc ListPrjTimeEntrys (ListPrjTimeEntryRequest) returns (stream PrjTimeEntryMessage);
}

message GetPrjTimeEntryRequest { string id = 1; }
message ListPrjTimeEntryRequest { string tenant_id = 1; int32 limit = 2; }
