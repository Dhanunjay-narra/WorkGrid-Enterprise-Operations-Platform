syntax = "proto3";

package nexora.projects;

message PrjSubtaskMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjSubtaskService {
  rpc GetPrjSubtask (GetPrjSubtaskRequest) returns (PrjSubtaskMessage);
  rpc ListPrjSubtasks (ListPrjSubtaskRequest) returns (stream PrjSubtaskMessage);
}

message GetPrjSubtaskRequest { string id = 1; }
message ListPrjSubtaskRequest { string tenant_id = 1; int32 limit = 2; }
