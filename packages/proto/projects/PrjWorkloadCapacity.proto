syntax = "proto3";

package nexora.projects;

message PrjWorkloadCapacityMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjWorkloadCapacityService {
  rpc GetPrjWorkloadCapacity (GetPrjWorkloadCapacityRequest) returns (PrjWorkloadCapacityMessage);
  rpc ListPrjWorkloadCapacitys (ListPrjWorkloadCapacityRequest) returns (stream PrjWorkloadCapacityMessage);
}

message GetPrjWorkloadCapacityRequest { string id = 1; }
message ListPrjWorkloadCapacityRequest { string tenant_id = 1; int32 limit = 2; }
