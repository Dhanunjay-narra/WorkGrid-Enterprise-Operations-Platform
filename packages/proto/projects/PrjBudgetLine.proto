syntax = "proto3";

package nexora.projects;

message PrjBudgetLineMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjBudgetLineService {
  rpc GetPrjBudgetLine (GetPrjBudgetLineRequest) returns (PrjBudgetLineMessage);
  rpc ListPrjBudgetLines (ListPrjBudgetLineRequest) returns (stream PrjBudgetLineMessage);
}

message GetPrjBudgetLineRequest { string id = 1; }
message ListPrjBudgetLineRequest { string tenant_id = 1; int32 limit = 2; }
