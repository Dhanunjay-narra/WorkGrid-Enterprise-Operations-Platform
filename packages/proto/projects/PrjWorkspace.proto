syntax = "proto3";

package nexora.projects;

message PrjWorkspaceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjWorkspaceService {
  rpc GetPrjWorkspace (GetPrjWorkspaceRequest) returns (PrjWorkspaceMessage);
  rpc ListPrjWorkspaces (ListPrjWorkspaceRequest) returns (stream PrjWorkspaceMessage);
}

message GetPrjWorkspaceRequest { string id = 1; }
message ListPrjWorkspaceRequest { string tenant_id = 1; int32 limit = 2; }
