syntax = "proto3";

package nexora.projects;

message PrjProjectHealthMetricMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjProjectHealthMetricService {
  rpc GetPrjProjectHealthMetric (GetPrjProjectHealthMetricRequest) returns (PrjProjectHealthMetricMessage);
  rpc ListPrjProjectHealthMetrics (ListPrjProjectHealthMetricRequest) returns (stream PrjProjectHealthMetricMessage);
}

message GetPrjProjectHealthMetricRequest { string id = 1; }
message ListPrjProjectHealthMetricRequest { string tenant_id = 1; int32 limit = 2; }
