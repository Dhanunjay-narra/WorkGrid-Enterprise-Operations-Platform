syntax = "proto3";

package nexora.projects;

message PrjGanttDependencyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjGanttDependencyService {
  rpc GetPrjGanttDependency (GetPrjGanttDependencyRequest) returns (PrjGanttDependencyMessage);
  rpc ListPrjGanttDependencys (ListPrjGanttDependencyRequest) returns (stream PrjGanttDependencyMessage);
}

message GetPrjGanttDependencyRequest { string id = 1; }
message ListPrjGanttDependencyRequest { string tenant_id = 1; int32 limit = 2; }
