syntax = "proto3";

package nexora.projects;

message PrjTaskMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjTaskService {
  rpc GetPrjTask (GetPrjTaskRequest) returns (PrjTaskMessage);
  rpc ListPrjTasks (ListPrjTaskRequest) returns (stream PrjTaskMessage);
}

message GetPrjTaskRequest { string id = 1; }
message ListPrjTaskRequest { string tenant_id = 1; int32 limit = 2; }
