syntax = "proto3";

package nexora.projects;

message PrjProjectMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjProjectService {
  rpc GetPrjProject (GetPrjProjectRequest) returns (PrjProjectMessage);
  rpc ListPrjProjects (ListPrjProjectRequest) returns (stream PrjProjectMessage);
}

message GetPrjProjectRequest { string id = 1; }
message ListPrjProjectRequest { string tenant_id = 1; int32 limit = 2; }
