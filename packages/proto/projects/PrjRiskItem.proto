syntax = "proto3";

package nexora.projects;

message PrjRiskItemMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjRiskItemService {
  rpc GetPrjRiskItem (GetPrjRiskItemRequest) returns (PrjRiskItemMessage);
  rpc ListPrjRiskItems (ListPrjRiskItemRequest) returns (stream PrjRiskItemMessage);
}

message GetPrjRiskItemRequest { string id = 1; }
message ListPrjRiskItemRequest { string tenant_id = 1; int32 limit = 2; }
