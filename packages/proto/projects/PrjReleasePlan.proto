syntax = "proto3";

package nexora.projects;

message PrjReleasePlanMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service PrjReleasePlanService {
  rpc GetPrjReleasePlan (GetPrjReleasePlanRequest) returns (PrjReleasePlanMessage);
  rpc ListPrjReleasePlans (ListPrjReleasePlanRequest) returns (stream PrjReleasePlanMessage);
}

message GetPrjReleasePlanRequest { string id = 1; }
message ListPrjReleasePlanRequest { string tenant_id = 1; int32 limit = 2; }
