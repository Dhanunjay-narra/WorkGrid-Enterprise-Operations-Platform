syntax = "proto3";

package nexora.documents;

message DocOcrExtractedDataMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocOcrExtractedDataService {
  rpc GetDocOcrExtractedData (GetDocOcrExtractedDataRequest) returns (DocOcrExtractedDataMessage);
  rpc ListDocOcrExtractedDatas (ListDocOcrExtractedDataRequest) returns (stream DocOcrExtractedDataMessage);
}

message GetDocOcrExtractedDataRequest { string id = 1; }
message ListDocOcrExtractedDataRequest { string tenant_id = 1; int32 limit = 2; }
