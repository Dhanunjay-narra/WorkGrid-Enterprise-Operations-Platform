syntax = "proto3";

package nexora.documents;

message DocWatermarkConfigMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocWatermarkConfigService {
  rpc GetDocWatermarkConfig (GetDocWatermarkConfigRequest) returns (DocWatermarkConfigMessage);
  rpc ListDocWatermarkConfigs (ListDocWatermarkConfigRequest) returns (stream DocWatermarkConfigMessage);
}

message GetDocWatermarkConfigRequest { string id = 1; }
message ListDocWatermarkConfigRequest { string tenant_id = 1; int32 limit = 2; }
