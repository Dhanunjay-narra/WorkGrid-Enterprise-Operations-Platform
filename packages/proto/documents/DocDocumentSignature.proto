syntax = "proto3";

package nexora.documents;

message DocDocumentSignatureMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocDocumentSignatureService {
  rpc GetDocDocumentSignature (GetDocDocumentSignatureRequest) returns (DocDocumentSignatureMessage);
  rpc ListDocDocumentSignatures (ListDocDocumentSignatureRequest) returns (stream DocDocumentSignatureMessage);
}

message GetDocDocumentSignatureRequest { string id = 1; }
message ListDocDocumentSignatureRequest { string tenant_id = 1; int32 limit = 2; }
