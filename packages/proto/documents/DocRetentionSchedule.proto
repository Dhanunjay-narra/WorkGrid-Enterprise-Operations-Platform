syntax = "proto3";

package nexora.documents;

message DocRetentionScheduleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocRetentionScheduleService {
  rpc GetDocRetentionSchedule (GetDocRetentionScheduleRequest) returns (DocRetentionScheduleMessage);
  rpc ListDocRetentionSchedules (ListDocRetentionScheduleRequest) returns (stream DocRetentionScheduleMessage);
}

message GetDocRetentionScheduleRequest { string id = 1; }
message ListDocRetentionScheduleRequest { string tenant_id = 1; int32 limit = 2; }
