syntax = "proto3";

package nexora.documents;

message DocDocumentFileMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocDocumentFileService {
  rpc GetDocDocumentFile (GetDocDocumentFileRequest) returns (DocDocumentFileMessage);
  rpc ListDocDocumentFiles (ListDocDocumentFileRequest) returns (stream DocDocumentFileMessage);
}

message GetDocDocumentFileRequest { string id = 1; }
message ListDocDocumentFileRequest { string tenant_id = 1; int32 limit = 2; }
