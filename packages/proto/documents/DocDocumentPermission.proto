syntax = "proto3";

package nexora.documents;

message DocDocumentPermissionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocDocumentPermissionService {
  rpc GetDocDocumentPermission (GetDocDocumentPermissionRequest) returns (DocDocumentPermissionMessage);
  rpc ListDocDocumentPermissions (ListDocDocumentPermissionRequest) returns (stream DocDocumentPermissionMessage);
}

message GetDocDocumentPermissionRequest { string id = 1; }
message ListDocDocumentPermissionRequest { string tenant_id = 1; int32 limit = 2; }
