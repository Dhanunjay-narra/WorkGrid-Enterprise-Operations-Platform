syntax = "proto3";

package nexora.documents;

message DocFileExportJobMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocFileExportJobService {
  rpc GetDocFileExportJob (GetDocFileExportJobRequest) returns (DocFileExportJobMessage);
  rpc ListDocFileExportJobs (ListDocFileExportJobRequest) returns (stream DocFileExportJobMessage);
}

message GetDocFileExportJobRequest { string id = 1; }
message ListDocFileExportJobRequest { string tenant_id = 1; int32 limit = 2; }
