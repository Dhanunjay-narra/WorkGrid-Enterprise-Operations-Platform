syntax = "proto3";

package nexora.documents;

message DocStorageBucketMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocStorageBucketService {
  rpc GetDocStorageBucket (GetDocStorageBucketRequest) returns (DocStorageBucketMessage);
  rpc ListDocStorageBuckets (ListDocStorageBucketRequest) returns (stream DocStorageBucketMessage);
}

message GetDocStorageBucketRequest { string id = 1; }
message ListDocStorageBucketRequest { string tenant_id = 1; int32 limit = 2; }
