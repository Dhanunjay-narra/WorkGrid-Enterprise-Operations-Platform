syntax = "proto3";

package nexora.documents;

message DocFolderMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service DocFolderService {
  rpc GetDocFolder (GetDocFolderRequest) returns (DocFolderMessage);
  rpc ListDocFolders (ListDocFolderRequest) returns (stream DocFolderMessage);
}

message GetDocFolderRequest { string id = 1; }
message ListDocFolderRequest { string tenant_id = 1; int32 limit = 2; }
