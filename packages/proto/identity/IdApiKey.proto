syntax = "proto3";

package nexora.identity;

message IdApiKeyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdApiKeyService {
  rpc GetIdApiKey (GetIdApiKeyRequest) returns (IdApiKeyMessage);
  rpc ListIdApiKeys (ListIdApiKeyRequest) returns (stream IdApiKeyMessage);
}

message GetIdApiKeyRequest { string id = 1; }
message ListIdApiKeyRequest { string tenant_id = 1; int32 limit = 2; }
