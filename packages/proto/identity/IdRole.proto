syntax = "proto3";

package nexora.identity;

message IdRoleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdRoleService {
  rpc GetIdRole (GetIdRoleRequest) returns (IdRoleMessage);
  rpc ListIdRoles (ListIdRoleRequest) returns (stream IdRoleMessage);
}

message GetIdRoleRequest { string id = 1; }
message ListIdRoleRequest { string tenant_id = 1; int32 limit = 2; }
