syntax = "proto3";

package nexora.identity;

message IdMfaConfigMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdMfaConfigService {
  rpc GetIdMfaConfig (GetIdMfaConfigRequest) returns (IdMfaConfigMessage);
  rpc ListIdMfaConfigs (ListIdMfaConfigRequest) returns (stream IdMfaConfigMessage);
}

message GetIdMfaConfigRequest { string id = 1; }
message ListIdMfaConfigRequest { string tenant_id = 1; int32 limit = 2; }
