syntax = "proto3";

package nexora.identity;

message IdPolicyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdPolicyService {
  rpc GetIdPolicy (GetIdPolicyRequest) returns (IdPolicyMessage);
  rpc ListIdPolicys (ListIdPolicyRequest) returns (stream IdPolicyMessage);
}

message GetIdPolicyRequest { string id = 1; }
message ListIdPolicyRequest { string tenant_id = 1; int32 limit = 2; }
