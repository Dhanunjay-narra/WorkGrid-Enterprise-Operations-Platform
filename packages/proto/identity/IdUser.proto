syntax = "proto3";

package nexora.identity;

message IdUserMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdUserService {
  rpc GetIdUser (GetIdUserRequest) returns (IdUserMessage);
  rpc ListIdUsers (ListIdUserRequest) returns (stream IdUserMessage);
}

message GetIdUserRequest { string id = 1; }
message ListIdUserRequest { string tenant_id = 1; int32 limit = 2; }
