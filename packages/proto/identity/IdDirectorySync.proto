syntax = "proto3";

package nexora.identity;

message IdDirectorySyncMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdDirectorySyncService {
  rpc GetIdDirectorySync (GetIdDirectorySyncRequest) returns (IdDirectorySyncMessage);
  rpc ListIdDirectorySyncs (ListIdDirectorySyncRequest) returns (stream IdDirectorySyncMessage);
}

message GetIdDirectorySyncRequest { string id = 1; }
message ListIdDirectorySyncRequest { string tenant_id = 1; int32 limit = 2; }
