syntax = "proto3";

package nexora.identity;

message IdSecurityKeyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdSecurityKeyService {
  rpc GetIdSecurityKey (GetIdSecurityKeyRequest) returns (IdSecurityKeyMessage);
  rpc ListIdSecurityKeys (ListIdSecurityKeyRequest) returns (stream IdSecurityKeyMessage);
}

message GetIdSecurityKeyRequest { string id = 1; }
message ListIdSecurityKeyRequest { string tenant_id = 1; int32 limit = 2; }
