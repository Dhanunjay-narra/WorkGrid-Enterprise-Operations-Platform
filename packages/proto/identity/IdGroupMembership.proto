syntax = "proto3";

package nexora.identity;

message IdGroupMembershipMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdGroupMembershipService {
  rpc GetIdGroupMembership (GetIdGroupMembershipRequest) returns (IdGroupMembershipMessage);
  rpc ListIdGroupMemberships (ListIdGroupMembershipRequest) returns (stream IdGroupMembershipMessage);
}

message GetIdGroupMembershipRequest { string id = 1; }
message ListIdGroupMembershipRequest { string tenant_id = 1; int32 limit = 2; }
