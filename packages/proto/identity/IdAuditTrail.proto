syntax = "proto3";

package nexora.identity;

message IdAuditTrailMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdAuditTrailService {
  rpc GetIdAuditTrail (GetIdAuditTrailRequest) returns (IdAuditTrailMessage);
  rpc ListIdAuditTrails (ListIdAuditTrailRequest) returns (stream IdAuditTrailMessage);
}

message GetIdAuditTrailRequest { string id = 1; }
message ListIdAuditTrailRequest { string tenant_id = 1; int32 limit = 2; }
