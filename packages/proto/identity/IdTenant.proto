syntax = "proto3";

package nexora.identity;

message IdTenantMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdTenantService {
  rpc GetIdTenant (GetIdTenantRequest) returns (IdTenantMessage);
  rpc ListIdTenants (ListIdTenantRequest) returns (stream IdTenantMessage);
}

message GetIdTenantRequest { string id = 1; }
message ListIdTenantRequest { string tenant_id = 1; int32 limit = 2; }
