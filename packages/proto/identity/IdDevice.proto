syntax = "proto3";

package nexora.identity;

message IdDeviceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdDeviceService {
  rpc GetIdDevice (GetIdDeviceRequest) returns (IdDeviceMessage);
  rpc ListIdDevices (ListIdDeviceRequest) returns (stream IdDeviceMessage);
}

message GetIdDeviceRequest { string id = 1; }
message ListIdDeviceRequest { string tenant_id = 1; int32 limit = 2; }
