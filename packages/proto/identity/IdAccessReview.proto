syntax = "proto3";

package nexora.identity;

message IdAccessReviewMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IdAccessReviewService {
  rpc GetIdAccessReview (GetIdAccessReviewRequest) returns (IdAccessReviewMessage);
  rpc ListIdAccessReviews (ListIdAccessReviewRequest) returns (stream IdAccessReviewMessage);
}

message GetIdAccessReviewRequest { string id = 1; }
message ListIdAccessReviewRequest { string tenant_id = 1; int32 limit = 2; }
