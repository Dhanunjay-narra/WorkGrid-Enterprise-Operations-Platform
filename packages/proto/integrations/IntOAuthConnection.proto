syntax = "proto3";

package nexora.integrations;

message IntOAuthConnectionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntOAuthConnectionService {
  rpc GetIntOAuthConnection (GetIntOAuthConnectionRequest) returns (IntOAuthConnectionMessage);
  rpc ListIntOAuthConnections (ListIntOAuthConnectionRequest) returns (stream IntOAuthConnectionMessage);
}

message GetIntOAuthConnectionRequest { string id = 1; }
message ListIntOAuthConnectionRequest { string tenant_id = 1; int32 limit = 2; }
