syntax = "proto3";

package nexora.integrations;

message IntWebhookSubscriptionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntWebhookSubscriptionService {
  rpc GetIntWebhookSubscription (GetIntWebhookSubscriptionRequest) returns (IntWebhookSubscriptionMessage);
  rpc ListIntWebhookSubscriptions (ListIntWebhookSubscriptionRequest) returns (stream IntWebhookSubscriptionMessage);
}

message GetIntWebhookSubscriptionRequest { string id = 1; }
message ListIntWebhookSubscriptionRequest { string tenant_id = 1; int32 limit = 2; }
