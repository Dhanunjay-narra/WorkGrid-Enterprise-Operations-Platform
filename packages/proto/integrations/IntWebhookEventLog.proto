syntax = "proto3";

package nexora.integrations;

message IntWebhookEventLogMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntWebhookEventLogService {
  rpc GetIntWebhookEventLog (GetIntWebhookEventLogRequest) returns (IntWebhookEventLogMessage);
  rpc ListIntWebhookEventLogs (ListIntWebhookEventLogRequest) returns (stream IntWebhookEventLogMessage);
}

message GetIntWebhookEventLogRequest { string id = 1; }
message ListIntWebhookEventLogRequest { string tenant_id = 1; int32 limit = 2; }
