syntax = "proto3";

package nexora.integrations;

message IntSyncHistoryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntSyncHistoryService {
  rpc GetIntSyncHistory (GetIntSyncHistoryRequest) returns (IntSyncHistoryMessage);
  rpc ListIntSyncHistorys (ListIntSyncHistoryRequest) returns (stream IntSyncHistoryMessage);
}

message GetIntSyncHistoryRequest { string id = 1; }
message ListIntSyncHistoryRequest { string tenant_id = 1; int32 limit = 2; }
