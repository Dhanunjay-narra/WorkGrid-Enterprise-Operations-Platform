syntax = "proto3";

package nexora.integrations;

message IntConnectorConfigMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntConnectorConfigService {
  rpc GetIntConnectorConfig (GetIntConnectorConfigRequest) returns (IntConnectorConfigMessage);
  rpc ListIntConnectorConfigs (ListIntConnectorConfigRequest) returns (stream IntConnectorConfigMessage);
}

message GetIntConnectorConfigRequest { string id = 1; }
message ListIntConnectorConfigRequest { string tenant_id = 1; int32 limit = 2; }
