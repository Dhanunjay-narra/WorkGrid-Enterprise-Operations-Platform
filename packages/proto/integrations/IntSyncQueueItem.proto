syntax = "proto3";

package nexora.integrations;

message IntSyncQueueItemMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntSyncQueueItemService {
  rpc GetIntSyncQueueItem (GetIntSyncQueueItemRequest) returns (IntSyncQueueItemMessage);
  rpc ListIntSyncQueueItems (ListIntSyncQueueItemRequest) returns (stream IntSyncQueueItemMessage);
}

message GetIntSyncQueueItemRequest { string id = 1; }
message ListIntSyncQueueItemRequest { string tenant_id = 1; int32 limit = 2; }
