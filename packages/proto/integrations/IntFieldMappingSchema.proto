syntax = "proto3";

package nexora.integrations;

message IntFieldMappingSchemaMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntFieldMappingSchemaService {
  rpc GetIntFieldMappingSchema (GetIntFieldMappingSchemaRequest) returns (IntFieldMappingSchemaMessage);
  rpc ListIntFieldMappingSchemas (ListIntFieldMappingSchemaRequest) returns (stream IntFieldMappingSchemaMessage);
}

message GetIntFieldMappingSchemaRequest { string id = 1; }
message ListIntFieldMappingSchemaRequest { string tenant_id = 1; int32 limit = 2; }
