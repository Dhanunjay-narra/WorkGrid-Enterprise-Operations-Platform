syntax = "proto3";

package nexora.integrations;

message IntTransformationRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service IntTransformationRuleService {
  rpc GetIntTransformationRule (GetIntTransformationRuleRequest) returns (IntTransformationRuleMessage);
  rpc ListIntTransformationRules (ListIntTransformationRuleRequest) returns (stream IntTransformationRuleMessage);
}

message GetIntTransformationRuleRequest { string id = 1; }
message ListIntTransformationRuleRequest { string tenant_id = 1; int32 limit = 2; }
