syntax = "proto3";

package nexora.communication;

message CommUserPresenceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommUserPresenceService {
  rpc GetCommUserPresence (GetCommUserPresenceRequest) returns (CommUserPresenceMessage);
  rpc ListCommUserPresences (ListCommUserPresenceRequest) returns (stream CommUserPresenceMessage);
}

message GetCommUserPresenceRequest { string id = 1; }
message ListCommUserPresenceRequest { string tenant_id = 1; int32 limit = 2; }
