syntax = "proto3";

package nexora.communication;

message CommWebhookDispatchLogMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommWebhookDispatchLogService {
  rpc GetCommWebhookDispatchLog (GetCommWebhookDispatchLogRequest) returns (CommWebhookDispatchLogMessage);
  rpc ListCommWebhookDispatchLogs (ListCommWebhookDispatchLogRequest) returns (stream CommWebhookDispatchLogMessage);
}

message GetCommWebhookDispatchLogRequest { string id = 1; }
message ListCommWebhookDispatchLogRequest { string tenant_id = 1; int32 limit = 2; }
