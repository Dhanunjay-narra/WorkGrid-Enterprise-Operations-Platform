syntax = "proto3";

package nexora.communication;

message CommBroadcastAnnouncementMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommBroadcastAnnouncementService {
  rpc GetCommBroadcastAnnouncement (GetCommBroadcastAnnouncementRequest) returns (CommBroadcastAnnouncementMessage);
  rpc ListCommBroadcastAnnouncements (ListCommBroadcastAnnouncementRequest) returns (stream CommBroadcastAnnouncementMessage);
}

message GetCommBroadcastAnnouncementRequest { string id = 1; }
message ListCommBroadcastAnnouncementRequest { string tenant_id = 1; int32 limit = 2; }
