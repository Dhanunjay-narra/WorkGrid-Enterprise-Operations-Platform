syntax = "proto3";

package nexora.communication;

message CommDigestQueueMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommDigestQueueService {
  rpc GetCommDigestQueue (GetCommDigestQueueRequest) returns (CommDigestQueueMessage);
  rpc ListCommDigestQueues (ListCommDigestQueueRequest) returns (stream CommDigestQueueMessage);
}

message GetCommDigestQueueRequest { string id = 1; }
message ListCommDigestQueueRequest { string tenant_id = 1; int32 limit = 2; }
