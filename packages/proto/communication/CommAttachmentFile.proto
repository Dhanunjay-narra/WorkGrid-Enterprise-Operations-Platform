syntax = "proto3";

package nexora.communication;

message CommAttachmentFileMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommAttachmentFileService {
  rpc GetCommAttachmentFile (GetCommAttachmentFileRequest) returns (CommAttachmentFileMessage);
  rpc ListCommAttachmentFiles (ListCommAttachmentFileRequest) returns (stream CommAttachmentFileMessage);
}

message GetCommAttachmentFileRequest { string id = 1; }
message ListCommAttachmentFileRequest { string tenant_id = 1; int32 limit = 2; }
