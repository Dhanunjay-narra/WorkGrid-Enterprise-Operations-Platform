syntax = "proto3";

package nexora.communication;

message CommNotificationPreferenceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommNotificationPreferenceService {
  rpc GetCommNotificationPreference (GetCommNotificationPreferenceRequest) returns (CommNotificationPreferenceMessage);
  rpc ListCommNotificationPreferences (ListCommNotificationPreferenceRequest) returns (stream CommNotificationPreferenceMessage);
}

message GetCommNotificationPreferenceRequest { string id = 1; }
message ListCommNotificationPreferenceRequest { string tenant_id = 1; int32 limit = 2; }
