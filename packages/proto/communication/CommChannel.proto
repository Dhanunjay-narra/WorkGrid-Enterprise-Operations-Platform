syntax = "proto3";

package nexora.communication;

message CommChannelMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommChannelService {
  rpc GetCommChannel (GetCommChannelRequest) returns (CommChannelMessage);
  rpc ListCommChannels (ListCommChannelRequest) returns (stream CommChannelMessage);
}

message GetCommChannelRequest { string id = 1; }
message ListCommChannelRequest { string tenant_id = 1; int32 limit = 2; }
