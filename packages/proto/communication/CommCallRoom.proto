syntax = "proto3";

package nexora.communication;

message CommCallRoomMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommCallRoomService {
  rpc GetCommCallRoom (GetCommCallRoomRequest) returns (CommCallRoomMessage);
  rpc ListCommCallRooms (ListCommCallRoomRequest) returns (stream CommCallRoomMessage);
}

message GetCommCallRoomRequest { string id = 1; }
message ListCommCallRoomRequest { string tenant_id = 1; int32 limit = 2; }
