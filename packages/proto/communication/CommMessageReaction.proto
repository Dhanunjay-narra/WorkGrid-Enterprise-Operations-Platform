syntax = "proto3";

package nexora.communication;

message CommMessageReactionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommMessageReactionService {
  rpc GetCommMessageReaction (GetCommMessageReactionRequest) returns (CommMessageReactionMessage);
  rpc ListCommMessageReactions (ListCommMessageReactionRequest) returns (stream CommMessageReactionMessage);
}

message GetCommMessageReactionRequest { string id = 1; }
message ListCommMessageReactionRequest { string tenant_id = 1; int32 limit = 2; }
