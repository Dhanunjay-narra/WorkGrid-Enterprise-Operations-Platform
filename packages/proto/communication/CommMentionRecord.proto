syntax = "proto3";

package nexora.communication;

message CommMentionRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service CommMentionRecordService {
  rpc GetCommMentionRecord (GetCommMentionRecordRequest) returns (CommMentionRecordMessage);
  rpc ListCommMentionRecords (ListCommMentionRecordRequest) returns (stream CommMentionRecordMessage);
}

message GetCommMentionRecordRequest { string id = 1; }
message ListCommMentionRecordRequest { string tenant_id = 1; int32 limit = 2; }
