syntax = "proto3";

package nexora.analytics;

message BiAnomalyThresholdMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiAnomalyThresholdService {
  rpc GetBiAnomalyThreshold (GetBiAnomalyThresholdRequest) returns (BiAnomalyThresholdMessage);
  rpc ListBiAnomalyThresholds (ListBiAnomalyThresholdRequest) returns (stream BiAnomalyThresholdMessage);
}

message GetBiAnomalyThresholdRequest { string id = 1; }
message ListBiAnomalyThresholdRequest { string tenant_id = 1; int32 limit = 2; }
