syntax = "proto3";

package nexora.analytics;

message BiExportJobMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiExportJobService {
  rpc GetBiExportJob (GetBiExportJobRequest) returns (BiExportJobMessage);
  rpc ListBiExportJobs (ListBiExportJobRequest) returns (stream BiExportJobMessage);
}

message GetBiExportJobRequest { string id = 1; }
message ListBiExportJobRequest { string tenant_id = 1; int32 limit = 2; }
