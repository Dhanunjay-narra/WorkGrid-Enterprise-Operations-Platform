syntax = "proto3";

package nexora.analytics;

message BiDashboardMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiDashboardService {
  rpc GetBiDashboard (GetBiDashboardRequest) returns (BiDashboardMessage);
  rpc ListBiDashboards (ListBiDashboardRequest) returns (stream BiDashboardMessage);
}

message GetBiDashboardRequest { string id = 1; }
message ListBiDashboardRequest { string tenant_id = 1; int32 limit = 2; }
