syntax = "proto3";

package nexora.analytics;

message BiExecutiveSummaryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiExecutiveSummaryService {
  rpc GetBiExecutiveSummary (GetBiExecutiveSummaryRequest) returns (BiExecutiveSummaryMessage);
  rpc ListBiExecutiveSummarys (ListBiExecutiveSummaryRequest) returns (stream BiExecutiveSummaryMessage);
}

message GetBiExecutiveSummaryRequest { string id = 1; }
message ListBiExecutiveSummaryRequest { string tenant_id = 1; int32 limit = 2; }
