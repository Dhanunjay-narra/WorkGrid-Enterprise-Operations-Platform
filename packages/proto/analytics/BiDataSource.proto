syntax = "proto3";

package nexora.analytics;

message BiDataSourceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiDataSourceService {
  rpc GetBiDataSource (GetBiDataSourceRequest) returns (BiDataSourceMessage);
  rpc ListBiDataSources (ListBiDataSourceRequest) returns (stream BiDataSourceMessage);
}

message GetBiDataSourceRequest { string id = 1; }
message ListBiDataSourceRequest { string tenant_id = 1; int32 limit = 2; }
