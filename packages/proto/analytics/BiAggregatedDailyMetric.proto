syntax = "proto3";

package nexora.analytics;

message BiAggregatedDailyMetricMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiAggregatedDailyMetricService {
  rpc GetBiAggregatedDailyMetric (GetBiAggregatedDailyMetricRequest) returns (BiAggregatedDailyMetricMessage);
  rpc ListBiAggregatedDailyMetrics (ListBiAggregatedDailyMetricRequest) returns (stream BiAggregatedDailyMetricMessage);
}

message GetBiAggregatedDailyMetricRequest { string id = 1; }
message ListBiAggregatedDailyMetricRequest { string tenant_id = 1; int32 limit = 2; }
