syntax = "proto3";

package nexora.analytics;

message BiReportQueryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiReportQueryService {
  rpc GetBiReportQuery (GetBiReportQueryRequest) returns (BiReportQueryMessage);
  rpc ListBiReportQuerys (ListBiReportQueryRequest) returns (stream BiReportQueryMessage);
}

message GetBiReportQueryRequest { string id = 1; }
message ListBiReportQueryRequest { string tenant_id = 1; int32 limit = 2; }
