syntax = "proto3";

package nexora.analytics;

message BiCohortGroupMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiCohortGroupService {
  rpc GetBiCohortGroup (GetBiCohortGroupRequest) returns (BiCohortGroupMessage);
  rpc ListBiCohortGroups (ListBiCohortGroupRequest) returns (stream BiCohortGroupMessage);
}

message GetBiCohortGroupRequest { string id = 1; }
message ListBiCohortGroupRequest { string tenant_id = 1; int32 limit = 2; }
