syntax = "proto3";

package nexora.analytics;

message BiTimeSeriesProjectionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiTimeSeriesProjectionService {
  rpc GetBiTimeSeriesProjection (GetBiTimeSeriesProjectionRequest) returns (BiTimeSeriesProjectionMessage);
  rpc ListBiTimeSeriesProjections (ListBiTimeSeriesProjectionRequest) returns (stream BiTimeSeriesProjectionMessage);
}

message GetBiTimeSeriesProjectionRequest { string id = 1; }
message ListBiTimeSeriesProjectionRequest { string tenant_id = 1; int32 limit = 2; }
