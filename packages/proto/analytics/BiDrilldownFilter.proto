syntax = "proto3";

package nexora.analytics;

message BiDrilldownFilterMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiDrilldownFilterService {
  rpc GetBiDrilldownFilter (GetBiDrilldownFilterRequest) returns (BiDrilldownFilterMessage);
  rpc ListBiDrilldownFilters (ListBiDrilldownFilterRequest) returns (stream BiDrilldownFilterMessage);
}

message GetBiDrilldownFilterRequest { string id = 1; }
message ListBiDrilldownFilterRequest { string tenant_id = 1; int32 limit = 2; }
