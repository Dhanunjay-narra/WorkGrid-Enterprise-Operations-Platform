syntax = "proto3";

package nexora.analytics;

message BiWidgetMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service BiWidgetService {
  rpc GetBiWidget (GetBiWidgetRequest) returns (BiWidgetMessage);
  rpc ListBiWidgets (ListBiWidgetRequest) returns (stream BiWidgetMessage);
}

message GetBiWidgetRequest { string id = 1; }
message ListBiWidgetRequest { string tenant_id = 1; int32 limit = 2; }
