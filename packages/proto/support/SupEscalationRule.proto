syntax = "proto3";

package nexora.support;

message SupEscalationRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupEscalationRuleService {
  rpc GetSupEscalationRule (GetSupEscalationRuleRequest) returns (SupEscalationRuleMessage);
  rpc ListSupEscalationRules (ListSupEscalationRuleRequest) returns (stream SupEscalationRuleMessage);
}

message GetSupEscalationRuleRequest { string id = 1; }
message ListSupEscalationRuleRequest { string tenant_id = 1; int32 limit = 2; }
