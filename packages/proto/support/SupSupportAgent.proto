syntax = "proto3";

package nexora.support;

message SupSupportAgentMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupSupportAgentService {
  rpc GetSupSupportAgent (GetSupSupportAgentRequest) returns (SupSupportAgentMessage);
  rpc ListSupSupportAgents (ListSupSupportAgentRequest) returns (stream SupSupportAgentMessage);
}

message GetSupSupportAgentRequest { string id = 1; }
message ListSupSupportAgentRequest { string tenant_id = 1; int32 limit = 2; }
