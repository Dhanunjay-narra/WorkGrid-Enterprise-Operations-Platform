syntax = "proto3";

package nexora.support;

message SupTicketMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupTicketService {
  rpc GetSupTicket (GetSupTicketRequest) returns (SupTicketMessage);
  rpc ListSupTickets (ListSupTicketRequest) returns (stream SupTicketMessage);
}

message GetSupTicketRequest { string id = 1; }
message ListSupTicketRequest { string tenant_id = 1; int32 limit = 2; }
