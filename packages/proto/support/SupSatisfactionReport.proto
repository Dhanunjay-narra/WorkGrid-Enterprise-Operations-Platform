syntax = "proto3";

package nexora.support;

message SupSatisfactionReportMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupSatisfactionReportService {
  rpc GetSupSatisfactionReport (GetSupSatisfactionReportRequest) returns (SupSatisfactionReportMessage);
  rpc ListSupSatisfactionReports (ListSupSatisfactionReportRequest) returns (stream SupSatisfactionReportMessage);
}

message GetSupSatisfactionReportRequest { string id = 1; }
message ListSupSatisfactionReportRequest { string tenant_id = 1; int32 limit = 2; }
