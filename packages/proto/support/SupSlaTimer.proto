syntax = "proto3";

package nexora.support;

message SupSlaTimerMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupSlaTimerService {
  rpc GetSupSlaTimer (GetSupSlaTimerRequest) returns (SupSlaTimerMessage);
  rpc ListSupSlaTimers (ListSupSlaTimerRequest) returns (stream SupSlaTimerMessage);
}

message GetSupSlaTimerRequest { string id = 1; }
message ListSupSlaTimerRequest { string tenant_id = 1; int32 limit = 2; }
