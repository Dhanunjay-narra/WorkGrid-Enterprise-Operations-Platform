syntax = "proto3";

package nexora.support;

message SupArticleCategoryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupArticleCategoryService {
  rpc GetSupArticleCategory (GetSupArticleCategoryRequest) returns (SupArticleCategoryMessage);
  rpc ListSupArticleCategorys (ListSupArticleCategoryRequest) returns (stream SupArticleCategoryMessage);
}

message GetSupArticleCategoryRequest { string id = 1; }
message ListSupArticleCategoryRequest { string tenant_id = 1; int32 limit = 2; }
