syntax = "proto3";

package nexora.support;

message SupCustomerSurveyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupCustomerSurveyService {
  rpc GetSupCustomerSurvey (GetSupCustomerSurveyRequest) returns (SupCustomerSurveyMessage);
  rpc ListSupCustomerSurveys (ListSupCustomerSurveyRequest) returns (stream SupCustomerSurveyMessage);
}

message GetSupCustomerSurveyRequest { string id = 1; }
message ListSupCustomerSurveyRequest { string tenant_id = 1; int32 limit = 2; }
