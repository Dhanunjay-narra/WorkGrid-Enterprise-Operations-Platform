syntax = "proto3";

package nexora.support;

message SupKnowledgeArticleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupKnowledgeArticleService {
  rpc GetSupKnowledgeArticle (GetSupKnowledgeArticleRequest) returns (SupKnowledgeArticleMessage);
  rpc ListSupKnowledgeArticles (ListSupKnowledgeArticleRequest) returns (stream SupKnowledgeArticleMessage);
}

message GetSupKnowledgeArticleRequest { string id = 1; }
message ListSupKnowledgeArticleRequest { string tenant_id = 1; int32 limit = 2; }
