syntax = "proto3";

package nexora.support;

message SupCsatScoreMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupCsatScoreService {
  rpc GetSupCsatScore (GetSupCsatScoreRequest) returns (SupCsatScoreMessage);
  rpc ListSupCsatScores (ListSupCsatScoreRequest) returns (stream SupCsatScoreMessage);
}

message GetSupCsatScoreRequest { string id = 1; }
message ListSupCsatScoreRequest { string tenant_id = 1; int32 limit = 2; }
