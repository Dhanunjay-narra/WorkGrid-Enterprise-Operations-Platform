syntax = "proto3";

package nexora.support;

message SupTicketTagMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupTicketTagService {
  rpc GetSupTicketTag (GetSupTicketTagRequest) returns (SupTicketTagMessage);
  rpc ListSupTicketTags (ListSupTicketTagRequest) returns (stream SupTicketTagMessage);
}

message GetSupTicketTagRequest { string id = 1; }
message ListSupTicketTagRequest { string tenant_id = 1; int32 limit = 2; }
