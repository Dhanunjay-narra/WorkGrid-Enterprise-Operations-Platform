syntax = "proto3";

package nexora.support;

message SupQueueMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SupQueueService {
  rpc GetSupQueue (GetSupQueueRequest) returns (SupQueueMessage);
  rpc ListSupQueues (ListSupQueueRequest) returns (stream SupQueueMessage);
}

message GetSupQueueRequest { string id = 1; }
message ListSupQueueRequest { string tenant_id = 1; int32 limit = 2; }
