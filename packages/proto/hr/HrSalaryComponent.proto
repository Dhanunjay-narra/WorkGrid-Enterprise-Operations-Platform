syntax = "proto3";

package nexora.hr;

message HrSalaryComponentMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrSalaryComponentService {
  rpc GetHrSalaryComponent (GetHrSalaryComponentRequest) returns (HrSalaryComponentMessage);
  rpc ListHrSalaryComponents (ListHrSalaryComponentRequest) returns (stream HrSalaryComponentMessage);
}

message GetHrSalaryComponentRequest { string id = 1; }
message ListHrSalaryComponentRequest { string tenant_id = 1; int32 limit = 2; }
