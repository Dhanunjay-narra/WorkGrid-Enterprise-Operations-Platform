syntax = "proto3";

package nexora.hr;

message HrSkillMatrixMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrSkillMatrixService {
  rpc GetHrSkillMatrix (GetHrSkillMatrixRequest) returns (HrSkillMatrixMessage);
  rpc ListHrSkillMatrixs (ListHrSkillMatrixRequest) returns (stream HrSkillMatrixMessage);
}

message GetHrSkillMatrixRequest { string id = 1; }
message ListHrSkillMatrixRequest { string tenant_id = 1; int32 limit = 2; }
