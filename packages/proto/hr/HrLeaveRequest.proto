syntax = "proto3";

package nexora.hr;

message HrLeaveRequestMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrLeaveRequestService {
  rpc GetHrLeaveRequest (GetHrLeaveRequestRequest) returns (HrLeaveRequestMessage);
  rpc ListHrLeaveRequests (ListHrLeaveRequestRequest) returns (stream HrLeaveRequestMessage);
}

message GetHrLeaveRequestRequest { string id = 1; }
message ListHrLeaveRequestRequest { string tenant_id = 1; int32 limit = 2; }
