syntax = "proto3";

package nexora.hr;

message HrShiftMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrShiftService {
  rpc GetHrShift (GetHrShiftRequest) returns (HrShiftMessage);
  rpc ListHrShifts (ListHrShiftRequest) returns (stream HrShiftMessage);
}

message GetHrShiftRequest { string id = 1; }
message ListHrShiftRequest { string tenant_id = 1; int32 limit = 2; }
