syntax = "proto3";

package nexora.hr;

message HrOnboardingChecklistMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrOnboardingChecklistService {
  rpc GetHrOnboardingChecklist (GetHrOnboardingChecklistRequest) returns (HrOnboardingChecklistMessage);
  rpc ListHrOnboardingChecklists (ListHrOnboardingChecklistRequest) returns (stream HrOnboardingChecklistMessage);
}

message GetHrOnboardingChecklistRequest { string id = 1; }
message ListHrOnboardingChecklistRequest { string tenant_id = 1; int32 limit = 2; }
