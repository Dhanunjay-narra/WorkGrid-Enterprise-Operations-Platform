syntax = "proto3";

package nexora.hr;

message HrInterviewStageMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrInterviewStageService {
  rpc GetHrInterviewStage (GetHrInterviewStageRequest) returns (HrInterviewStageMessage);
  rpc ListHrInterviewStages (ListHrInterviewStageRequest) returns (stream HrInterviewStageMessage);
}

message GetHrInterviewStageRequest { string id = 1; }
message ListHrInterviewStageRequest { string tenant_id = 1; int32 limit = 2; }
