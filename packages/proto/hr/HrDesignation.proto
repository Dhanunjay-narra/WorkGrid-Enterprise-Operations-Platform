syntax = "proto3";

package nexora.hr;

message HrDesignationMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrDesignationService {
  rpc GetHrDesignation (GetHrDesignationRequest) returns (HrDesignationMessage);
  rpc ListHrDesignations (ListHrDesignationRequest) returns (stream HrDesignationMessage);
}

message GetHrDesignationRequest { string id = 1; }
message ListHrDesignationRequest { string tenant_id = 1; int32 limit = 2; }
