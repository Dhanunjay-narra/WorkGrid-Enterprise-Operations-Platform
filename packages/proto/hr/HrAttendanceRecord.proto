syntax = "proto3";

package nexora.hr;

message HrAttendanceRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrAttendanceRecordService {
  rpc GetHrAttendanceRecord (GetHrAttendanceRecordRequest) returns (HrAttendanceRecordMessage);
  rpc ListHrAttendanceRecords (ListHrAttendanceRecordRequest) returns (stream HrAttendanceRecordMessage);
}

message GetHrAttendanceRecordRequest { string id = 1; }
message ListHrAttendanceRecordRequest { string tenant_id = 1; int32 limit = 2; }
