syntax = "proto3";

package nexora.hr;

message HrPayrollSlipMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service HrPayrollSlipService {
  rpc GetHrPayrollSlip (GetHrPayrollSlipRequest) returns (HrPayrollSlipMessage);
  rpc ListHrPayrollSlips (ListHrPayrollSlipRequest) returns (stream HrPayrollSlipMessage);
}

message GetHrPayrollSlipRequest { string id = 1; }
message ListHrPayrollSlipRequest { string tenant_id = 1; int32 limit = 2; }
