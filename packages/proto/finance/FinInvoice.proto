syntax = "proto3";

package nexora.finance;

message FinInvoiceMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinInvoiceService {
  rpc GetFinInvoice (GetFinInvoiceRequest) returns (FinInvoiceMessage);
  rpc ListFinInvoices (ListFinInvoiceRequest) returns (stream FinInvoiceMessage);
}

message GetFinInvoiceRequest { string id = 1; }
message ListFinInvoiceRequest { string tenant_id = 1; int32 limit = 2; }
