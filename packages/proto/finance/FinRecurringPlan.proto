syntax = "proto3";

package nexora.finance;

message FinRecurringPlanMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinRecurringPlanService {
  rpc GetFinRecurringPlan (GetFinRecurringPlanRequest) returns (FinRecurringPlanMessage);
  rpc ListFinRecurringPlans (ListFinRecurringPlanRequest) returns (stream FinRecurringPlanMessage);
}

message GetFinRecurringPlanRequest { string id = 1; }
message ListFinRecurringPlanRequest { string tenant_id = 1; int32 limit = 2; }
