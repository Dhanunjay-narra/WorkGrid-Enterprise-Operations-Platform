syntax = "proto3";

package nexora.finance;

message FinFxRateHistoryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinFxRateHistoryService {
  rpc GetFinFxRateHistory (GetFinFxRateHistoryRequest) returns (FinFxRateHistoryMessage);
  rpc ListFinFxRateHistorys (ListFinFxRateHistoryRequest) returns (stream FinFxRateHistoryMessage);
}

message GetFinFxRateHistoryRequest { string id = 1; }
message ListFinFxRateHistoryRequest { string tenant_id = 1; int32 limit = 2; }
