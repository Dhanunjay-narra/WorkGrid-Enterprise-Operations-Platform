syntax = "proto3";

package nexora.finance;

message FinJournalEntryMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinJournalEntryService {
  rpc GetFinJournalEntry (GetFinJournalEntryRequest) returns (FinJournalEntryMessage);
  rpc ListFinJournalEntrys (ListFinJournalEntryRequest) returns (stream FinJournalEntryMessage);
}

message GetFinJournalEntryRequest { string id = 1; }
message ListFinJournalEntryRequest { string tenant_id = 1; int32 limit = 2; }
