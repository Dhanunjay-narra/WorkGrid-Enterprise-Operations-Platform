syntax = "proto3";

package nexora.finance;

message FinVendorBillMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinVendorBillService {
  rpc GetFinVendorBill (GetFinVendorBillRequest) returns (FinVendorBillMessage);
  rpc ListFinVendorBills (ListFinVendorBillRequest) returns (stream FinVendorBillMessage);
}

message GetFinVendorBillRequest { string id = 1; }
message ListFinVendorBillRequest { string tenant_id = 1; int32 limit = 2; }
