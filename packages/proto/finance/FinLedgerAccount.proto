syntax = "proto3";

package nexora.finance;

message FinLedgerAccountMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinLedgerAccountService {
  rpc GetFinLedgerAccount (GetFinLedgerAccountRequest) returns (FinLedgerAccountMessage);
  rpc ListFinLedgerAccounts (ListFinLedgerAccountRequest) returns (stream FinLedgerAccountMessage);
}

message GetFinLedgerAccountRequest { string id = 1; }
message ListFinLedgerAccountRequest { string tenant_id = 1; int32 limit = 2; }
