syntax = "proto3";

package nexora.finance;

message FinTaxRateMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinTaxRateService {
  rpc GetFinTaxRate (GetFinTaxRateRequest) returns (FinTaxRateMessage);
  rpc ListFinTaxRates (ListFinTaxRateRequest) returns (stream FinTaxRateMessage);
}

message GetFinTaxRateRequest { string id = 1; }
message ListFinTaxRateRequest { string tenant_id = 1; int32 limit = 2; }
