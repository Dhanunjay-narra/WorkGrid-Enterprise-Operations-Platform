syntax = "proto3";

package nexora.finance;

message FinRefundRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinRefundRecordService {
  rpc GetFinRefundRecord (GetFinRefundRecordRequest) returns (FinRefundRecordMessage);
  rpc ListFinRefundRecords (ListFinRefundRecordRequest) returns (stream FinRefundRecordMessage);
}

message GetFinRefundRecordRequest { string id = 1; }
message ListFinRefundRecordRequest { string tenant_id = 1; int32 limit = 2; }
