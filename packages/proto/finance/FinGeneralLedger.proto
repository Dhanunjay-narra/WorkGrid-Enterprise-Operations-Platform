syntax = "proto3";

package nexora.finance;

message FinGeneralLedgerMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinGeneralLedgerService {
  rpc GetFinGeneralLedger (GetFinGeneralLedgerRequest) returns (FinGeneralLedgerMessage);
  rpc ListFinGeneralLedgers (ListFinGeneralLedgerRequest) returns (stream FinGeneralLedgerMessage);
}

message GetFinGeneralLedgerRequest { string id = 1; }
message ListFinGeneralLedgerRequest { string tenant_id = 1; int32 limit = 2; }
