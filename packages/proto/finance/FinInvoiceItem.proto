syntax = "proto3";

package nexora.finance;

message FinInvoiceItemMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinInvoiceItemService {
  rpc GetFinInvoiceItem (GetFinInvoiceItemRequest) returns (FinInvoiceItemMessage);
  rpc ListFinInvoiceItems (ListFinInvoiceItemRequest) returns (stream FinInvoiceItemMessage);
}

message GetFinInvoiceItemRequest { string id = 1; }
message ListFinInvoiceItemRequest { string tenant_id = 1; int32 limit = 2; }
