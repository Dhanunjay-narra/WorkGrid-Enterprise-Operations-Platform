syntax = "proto3";

package nexora.finance;

message FinCostCenterMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service FinCostCenterService {
  rpc GetFinCostCenter (GetFinCostCenterRequest) returns (FinCostCenterMessage);
  rpc ListFinCostCenters (ListFinCostCenterRequest) returns (stream FinCostCenterMessage);
}

message GetFinCostCenterRequest { string id = 1; }
message ListFinCostCenterRequest { string tenant_id = 1; int32 limit = 2; }
