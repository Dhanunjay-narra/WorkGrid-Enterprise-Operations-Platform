syntax = "proto3";

package nexora.workflow;

message WfWorkflowDefinitionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfWorkflowDefinitionService {
  rpc GetWfWorkflowDefinition (GetWfWorkflowDefinitionRequest) returns (WfWorkflowDefinitionMessage);
  rpc ListWfWorkflowDefinitions (ListWfWorkflowDefinitionRequest) returns (stream WfWorkflowDefinitionMessage);
}

message GetWfWorkflowDefinitionRequest { string id = 1; }
message ListWfWorkflowDefinitionRequest { string tenant_id = 1; int32 limit = 2; }
