syntax = "proto3";

package nexora.workflow;

message WfCronScheduleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfCronScheduleService {
  rpc GetWfCronSchedule (GetWfCronScheduleRequest) returns (WfCronScheduleMessage);
  rpc ListWfCronSchedules (ListWfCronScheduleRequest) returns (stream WfCronScheduleMessage);
}

message GetWfCronScheduleRequest { string id = 1; }
message ListWfCronScheduleRequest { string tenant_id = 1; int32 limit = 2; }
