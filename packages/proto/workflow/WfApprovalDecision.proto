syntax = "proto3";

package nexora.workflow;

message WfApprovalDecisionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfApprovalDecisionService {
  rpc GetWfApprovalDecision (GetWfApprovalDecisionRequest) returns (WfApprovalDecisionMessage);
  rpc ListWfApprovalDecisions (ListWfApprovalDecisionRequest) returns (stream WfApprovalDecisionMessage);
}

message GetWfApprovalDecisionRequest { string id = 1; }
message ListWfApprovalDecisionRequest { string tenant_id = 1; int32 limit = 2; }
