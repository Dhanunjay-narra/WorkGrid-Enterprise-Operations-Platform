syntax = "proto3";

package nexora.workflow;

message WfEventTriggerMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfEventTriggerService {
  rpc GetWfEventTrigger (GetWfEventTriggerRequest) returns (WfEventTriggerMessage);
  rpc ListWfEventTriggers (ListWfEventTriggerRequest) returns (stream WfEventTriggerMessage);
}

message GetWfEventTriggerRequest { string id = 1; }
message ListWfEventTriggerRequest { string tenant_id = 1; int32 limit = 2; }
