syntax = "proto3";

package nexora.workflow;

message WfVariableStoreMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfVariableStoreService {
  rpc GetWfVariableStore (GetWfVariableStoreRequest) returns (WfVariableStoreMessage);
  rpc ListWfVariableStores (ListWfVariableStoreRequest) returns (stream WfVariableStoreMessage);
}

message GetWfVariableStoreRequest { string id = 1; }
message ListWfVariableStoreRequest { string tenant_id = 1; int32 limit = 2; }
