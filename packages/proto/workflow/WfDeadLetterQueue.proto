syntax = "proto3";

package nexora.workflow;

message WfDeadLetterQueueMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfDeadLetterQueueService {
  rpc GetWfDeadLetterQueue (GetWfDeadLetterQueueRequest) returns (WfDeadLetterQueueMessage);
  rpc ListWfDeadLetterQueues (ListWfDeadLetterQueueRequest) returns (stream WfDeadLetterQueueMessage);
}

message GetWfDeadLetterQueueRequest { string id = 1; }
message ListWfDeadLetterQueueRequest { string tenant_id = 1; int32 limit = 2; }
