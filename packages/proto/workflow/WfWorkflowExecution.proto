syntax = "proto3";

package nexora.workflow;

message WfWorkflowExecutionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfWorkflowExecutionService {
  rpc GetWfWorkflowExecution (GetWfWorkflowExecutionRequest) returns (WfWorkflowExecutionMessage);
  rpc ListWfWorkflowExecutions (ListWfWorkflowExecutionRequest) returns (stream WfWorkflowExecutionMessage);
}

message GetWfWorkflowExecutionRequest { string id = 1; }
message ListWfWorkflowExecutionRequest { string tenant_id = 1; int32 limit = 2; }
