syntax = "proto3";

package nexora.workflow;

message WfExecutionStepMetricMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfExecutionStepMetricService {
  rpc GetWfExecutionStepMetric (GetWfExecutionStepMetricRequest) returns (WfExecutionStepMetricMessage);
  rpc ListWfExecutionStepMetrics (ListWfExecutionStepMetricRequest) returns (stream WfExecutionStepMetricMessage);
}

message GetWfExecutionStepMetricRequest { string id = 1; }
message ListWfExecutionStepMetricRequest { string tenant_id = 1; int32 limit = 2; }
