syntax = "proto3";

package nexora.workflow;

message WfWorkflowVersionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfWorkflowVersionService {
  rpc GetWfWorkflowVersion (GetWfWorkflowVersionRequest) returns (WfWorkflowVersionMessage);
  rpc ListWfWorkflowVersions (ListWfWorkflowVersionRequest) returns (stream WfWorkflowVersionMessage);
}

message GetWfWorkflowVersionRequest { string id = 1; }
message ListWfWorkflowVersionRequest { string tenant_id = 1; int32 limit = 2; }
