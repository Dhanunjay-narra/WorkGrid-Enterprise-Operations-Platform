syntax = "proto3";

package nexora.workflow;

message WfRetryPolicyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service WfRetryPolicyService {
  rpc GetWfRetryPolicy (GetWfRetryPolicyRequest) returns (WfRetryPolicyMessage);
  rpc ListWfRetryPolicys (ListWfRetryPolicyRequest) returns (stream WfRetryPolicyMessage);
}

message GetWfRetryPolicyRequest { string id = 1; }
message ListWfRetryPolicyRequest { string tenant_id = 1; int32 limit = 2; }
