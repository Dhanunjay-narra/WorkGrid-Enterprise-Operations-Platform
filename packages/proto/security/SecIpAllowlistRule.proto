syntax = "proto3";

package nexora.security;

message SecIpAllowlistRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecIpAllowlistRuleService {
  rpc GetSecIpAllowlistRule (GetSecIpAllowlistRuleRequest) returns (SecIpAllowlistRuleMessage);
  rpc ListSecIpAllowlistRules (ListSecIpAllowlistRuleRequest) returns (stream SecIpAllowlistRuleMessage);
}

message GetSecIpAllowlistRuleRequest { string id = 1; }
message ListSecIpAllowlistRuleRequest { string tenant_id = 1; int32 limit = 2; }
