syntax = "proto3";

package nexora.security;

message SecComplianceReportMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecComplianceReportService {
  rpc GetSecComplianceReport (GetSecComplianceReportRequest) returns (SecComplianceReportMessage);
  rpc ListSecComplianceReports (ListSecComplianceReportRequest) returns (stream SecComplianceReportMessage);
}

message GetSecComplianceReportRequest { string id = 1; }
message ListSecComplianceReportRequest { string tenant_id = 1; int32 limit = 2; }
