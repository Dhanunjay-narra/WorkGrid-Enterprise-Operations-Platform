syntax = "proto3";

package nexora.security;

message SecThreatEventMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecThreatEventService {
  rpc GetSecThreatEvent (GetSecThreatEventRequest) returns (SecThreatEventMessage);
  rpc ListSecThreatEvents (ListSecThreatEventRequest) returns (stream SecThreatEventMessage);
}

message GetSecThreatEventRequest { string id = 1; }
message ListSecThreatEventRequest { string tenant_id = 1; int32 limit = 2; }
