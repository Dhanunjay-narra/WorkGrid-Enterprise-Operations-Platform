syntax = "proto3";

package nexora.security;

message SecDeviceTrustRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecDeviceTrustRecordService {
  rpc GetSecDeviceTrustRecord (GetSecDeviceTrustRecordRequest) returns (SecDeviceTrustRecordMessage);
  rpc ListSecDeviceTrustRecords (ListSecDeviceTrustRecordRequest) returns (stream SecDeviceTrustRecordMessage);
}

message GetSecDeviceTrustRecordRequest { string id = 1; }
message ListSecDeviceTrustRecordRequest { string tenant_id = 1; int32 limit = 2; }
