syntax = "proto3";

package nexora.security;

message SecRateLimitCounterMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecRateLimitCounterService {
  rpc GetSecRateLimitCounter (GetSecRateLimitCounterRequest) returns (SecRateLimitCounterMessage);
  rpc ListSecRateLimitCounters (ListSecRateLimitCounterRequest) returns (stream SecRateLimitCounterMessage);
}

message GetSecRateLimitCounterRequest { string id = 1; }
message ListSecRateLimitCounterRequest { string tenant_id = 1; int32 limit = 2; }
