syntax = "proto3";

package nexora.security;

message SecPiiMaskingRuleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecPiiMaskingRuleService {
  rpc GetSecPiiMaskingRule (GetSecPiiMaskingRuleRequest) returns (SecPiiMaskingRuleMessage);
  rpc ListSecPiiMaskingRules (ListSecPiiMaskingRuleRequest) returns (stream SecPiiMaskingRuleMessage);
}

message GetSecPiiMaskingRuleRequest { string id = 1; }
message ListSecPiiMaskingRuleRequest { string tenant_id = 1; int32 limit = 2; }
