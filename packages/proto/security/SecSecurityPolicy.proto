syntax = "proto3";

package nexora.security;

message SecSecurityPolicyMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecSecurityPolicyService {
  rpc GetSecSecurityPolicy (GetSecSecurityPolicyRequest) returns (SecSecurityPolicyMessage);
  rpc ListSecSecurityPolicys (ListSecSecurityPolicyRequest) returns (stream SecSecurityPolicyMessage);
}

message GetSecSecurityPolicyRequest { string id = 1; }
message ListSecSecurityPolicyRequest { string tenant_id = 1; int32 limit = 2; }
