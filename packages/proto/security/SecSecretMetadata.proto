syntax = "proto3";

package nexora.security;

message SecSecretMetadataMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecSecretMetadataService {
  rpc GetSecSecretMetadata (GetSecSecretMetadataRequest) returns (SecSecretMetadataMessage);
  rpc ListSecSecretMetadatas (ListSecSecretMetadataRequest) returns (stream SecSecretMetadataMessage);
}

message GetSecSecretMetadataRequest { string id = 1; }
message ListSecSecretMetadataRequest { string tenant_id = 1; int32 limit = 2; }
