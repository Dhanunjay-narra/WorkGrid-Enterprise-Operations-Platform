syntax = "proto3";

package nexora.security;

message SecAccessReviewScheduleMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service SecAccessReviewScheduleService {
  rpc GetSecAccessReviewSchedule (GetSecAccessReviewScheduleRequest) returns (SecAccessReviewScheduleMessage);
  rpc ListSecAccessReviewSchedules (ListSecAccessReviewScheduleRequest) returns (stream SecAccessReviewScheduleMessage);
}

message GetSecAccessReviewScheduleRequest { string id = 1; }
message ListSecAccessReviewScheduleRequest { string tenant_id = 1; int32 limit = 2; }
