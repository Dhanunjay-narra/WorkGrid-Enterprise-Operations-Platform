syntax = "proto3";

package nexora.events;

message EvtEventBatchMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service EvtEventBatchService {
  rpc GetEvtEventBatch (GetEvtEventBatchRequest) returns (EvtEventBatchMessage);
  rpc ListEvtEventBatchs (ListEvtEventBatchRequest) returns (stream EvtEventBatchMessage);
}

message GetEvtEventBatchRequest { string id = 1; }
message ListEvtEventBatchRequest { string tenant_id = 1; int32 limit = 2; }
