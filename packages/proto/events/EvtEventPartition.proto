syntax = "proto3";

package nexora.events;

message EvtEventPartitionMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service EvtEventPartitionService {
  rpc GetEvtEventPartition (GetEvtEventPartitionRequest) returns (EvtEventPartitionMessage);
  rpc ListEvtEventPartitions (ListEvtEventPartitionRequest) returns (stream EvtEventPartitionMessage);
}

message GetEvtEventPartitionRequest { string id = 1; }
message ListEvtEventPartitionRequest { string tenant_id = 1; int32 limit = 2; }
