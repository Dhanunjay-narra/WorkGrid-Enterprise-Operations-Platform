syntax = "proto3";

package nexora.events;

message EvtDeadLetterEventMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service EvtDeadLetterEventService {
  rpc GetEvtDeadLetterEvent (GetEvtDeadLetterEventRequest) returns (EvtDeadLetterEventMessage);
  rpc ListEvtDeadLetterEvents (ListEvtDeadLetterEventRequest) returns (stream EvtDeadLetterEventMessage);
}

message GetEvtDeadLetterEventRequest { string id = 1; }
message ListEvtDeadLetterEventRequest { string tenant_id = 1; int32 limit = 2; }
