syntax = "proto3";

package nexora.events;

message EvtOutboxMessageMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service EvtOutboxMessageService {
  rpc GetEvtOutboxMessage (GetEvtOutboxMessageRequest) returns (EvtOutboxMessageMessage);
  rpc ListEvtOutboxMessages (ListEvtOutboxMessageRequest) returns (stream EvtOutboxMessageMessage);
}

message GetEvtOutboxMessageRequest { string id = 1; }
message ListEvtOutboxMessageRequest { string tenant_id = 1; int32 limit = 2; }
