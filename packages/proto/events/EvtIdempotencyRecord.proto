syntax = "proto3";

package nexora.events;

message EvtIdempotencyRecordMessage {
  string id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  string status = 5;
  int64 created_at_unix = 6;
}

service EvtIdempotencyRecordService {
  rpc GetEvtIdempotencyRecord (GetEvtIdempotencyRecordRequest) returns (EvtIdempotencyRecordMessage);
  rpc ListEvtIdempotencyRecords (ListEvtIdempotencyRecordRequest) returns (stream EvtIdempotencyRecordMessage);
}

message GetEvtIdempotencyRecordRequest { string id = 1; }
message ListEvtIdempotencyRecordRequest { string tenant_id = 1; int32 limit = 2; }
