apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexora-ingress
  namespace: nexora-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.nexora.io
        - api.nexora.io
      secretName: nexora-tls
  rules:
    - host: app.nexora.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-web
                port:
                  number: 3000
    - host: api.nexora.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexora-api-gateway
                port:
                  number: 4000
